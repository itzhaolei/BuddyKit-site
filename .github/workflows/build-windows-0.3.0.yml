name: Build BuddyKit Windows 0.3.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out encrypted build input
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.6.2

      - name: Decrypt source into temporary build directory
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          from nacl.secret import SecretBox

          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          if len(key) != SecretBox.KEY_SIZE:
              raise RuntimeError('Invalid build decryption key length')
          encrypted = Path('.github/release-inputs/BuddyKit-0.3.0.tar.enc').read_bytes()
          archive = Path(os.environ['RUNNER_TEMP']) / 'BuddyKit-0.3.0-source.tar.gz'
          source = Path(os.environ['RUNNER_TEMP']) / 'buddykit-private-source'
          source.mkdir()
          plaintext = SecretBox(key).decrypt(encrypted)
          expected = '6c58030edef926c72cafdfc41c7fd79135f818a1c14694f9d194b788eef8651f'
          if hashlib.sha256(plaintext).hexdigest() != expected:
              raise RuntimeError('Build input checksum does not match the approved source')
          archive.write_bytes(plaintext)
          del plaintext
          del key, encrypted
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall(source, filter='data')
          archive.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source decryption failed' }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Parse the Windows updater helper
        shell: powershell
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $source = Get-Content -Raw app/windows/runner/app_updater.cpp
          $match = [regex]::Match($source, 'R"POWERSHELL\((.*?)\)POWERSHELL"', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) { throw 'Updater helper was not found' }
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($match.Groups[1].Value, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $csharp = [regex]::Match($match.Groups[1].Value, "Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $csharp.Success) { throw 'Installer process-job helper was not found' }
          Add-Type -TypeDefinition $csharp.Groups[1].Value
          foreach ($script in @('scripts/test_windows_auto_update.ps1', 'scripts/test_windows_app_version.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          }

      - name: Build Windows release
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          $buildLog = Join-Path $env:RUNNER_TEMP 'buddykit-windows-build.log'
          flutter build windows --release *> $buildLog
          if ($LASTEXITCODE -ne 0) { Get-Content $buildLog -Tail 100; throw 'Windows build failed' }
          Write-Output 'Windows release built successfully.'
          $release = 'build/windows/x64/runner/Release'
          foreach ($file in @(
            'buddykit.exe',
            'flutter_windows.dll',
            'msvcp140.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'data/flutter_assets/assets/tray_icon.ico'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $file))) {
              throw "Required Windows bundle file missing: $file"
            }
          }
          $version = (Get-Item (Join-Path $release 'buddykit.exe')).VersionInfo.ProductVersion
          if ($version -notmatch '^0\.3\.0(?:\+12|\.12)?$') {
            throw 'Windows executable does not have the expected 0.3.0 version'
          }

      - name: Verify version label in the Windows app
        shell: powershell
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          ./scripts/test_windows_app_version.ps1 -ExecutablePath (Resolve-Path app/build/windows/x64/runner/Release/buddykit.exe).Path -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'buddykit-version-evidence')

      - name: Upload version display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-version-evidence-0.3.0
          path: ${{ runner.temp }}/buddykit-version-evidence/
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify single-instance window lifecycle
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          ./scripts/test_windows_single_instance.ps1 -ExecutablePath (Resolve-Path app/build/windows/x64/runner/Release/buddykit.exe).Path

      - name: Build installer with Inno Setup
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          iscc '/DMyAppVersion=0.3.0' 'packaging/windows/BuddyKit.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer packaging failed' }
          if (-not (Test-Path -LiteralPath 'dist/BuddyKit-0.3.0-Setup.exe')) {
            throw 'Expected Windows installer was not produced'
          }

      - name: Upload Windows installer only
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-installer-0.3.0
          path: ${{ runner.temp }}/buddykit-private-source/dist/BuddyKit-0.3.0-Setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Build the previous-build upgrade baseline
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $ErrorActionPreference = 'Stop'
          $buildLog = Join-Path $env:RUNNER_TEMP 'buddykit-windows-baseline-build.log'
          flutter build windows --release --build-name 0.3.0 --build-number 11 *> $buildLog
          if ($LASTEXITCODE -ne 0) { Get-Content $buildLog -Tail 100; throw 'Windows baseline build failed' }
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          if ((Get-Item (Join-Path $release 'buddykit.exe')).VersionInfo.ProductVersion -ne '0.3.0+11') {
            throw 'Baseline executable does not have the expected old build number'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'BuddyKit-windows-update-baseline-0.3.0-build11.zip'
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $archive -CompressionLevel Optimal
          Write-Output 'Complete baseline runtime bundle prepared; private source is excluded.'

      - name: Upload previous-build runtime for the real update test
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-update-baseline-0.3.0-build11
          path: ${{ runner.temp }}/BuddyKit-windows-update-baseline-0.3.0-build11.zip
          if-no-files-found: error
          retention-days: 3

      - name: Remove decrypted build input
        if: always()
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-private-source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'BuddyKit-0.3.0-source.tar.gz') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-windows-build.log') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-windows-baseline-build.log') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'BuddyKit-windows-update-baseline-0.3.0-build11.zip') -Force -ErrorAction SilentlyContinue
