name: Verify BuddyKit Windows 0.3.0 automatic update

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows 0.3.0 build run containing the build 11 baseline
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  real-auto-update:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out encrypted test input
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.6.2

      - name: Decrypt source into temporary build directory
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          from nacl.secret import SecretBox

          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          if len(key) != SecretBox.KEY_SIZE:
              raise RuntimeError('Invalid build decryption key length')
          encrypted = Path('.github/release-inputs/BuddyKit-0.3.0.tar.enc').read_bytes()
          archive = Path(os.environ['RUNNER_TEMP']) / 'BuddyKit-0.3.0-source.tar.gz'
          source = Path(os.environ['RUNNER_TEMP']) / 'buddykit-private-source'
          source.mkdir()
          plaintext = SecretBox(key).decrypt(encrypted)
          expected = '3d5c29ef232ae72b9554819721d978a6ff462d14972d5b187661bb40bf65a5f6'
          if hashlib.sha256(plaintext).hexdigest() != expected:
              raise RuntimeError('Build input checksum does not match the approved source')
          archive.write_bytes(plaintext)
          del plaintext
          del key, encrypted
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall(source, filter='data')
          archive.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source decryption failed' }

      - name: Validate the selected build run
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^[0-9]+$') { throw 'Build run ID must be numeric' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the selected build run' }
          $run = $json | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'The selected build run must have completed successfully' }
          if ($run.name -ne 'Build BuddyKit Windows 0.3.0') { throw 'The selected run is not the approved Windows 0.3.0 build workflow' }
          if ($run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'The baseline must come from this repository' }

      - name: Download previous-build baseline from the selected build
        uses: actions/download-artifact@v4
        with:
          name: BuddyKit-windows-update-baseline-0.3.0-build11
          path: ${{ runner.temp }}/buddykit-update-baseline-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Extract and validate the runtime baseline
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'buddykit-update-baseline-artifact/BuddyKit-windows-update-baseline-0.3.0-build11.zip'
          $baseline = Join-Path $env:RUNNER_TEMP 'buddykit-update-baseline'
          Expand-Archive -LiteralPath $archive -DestinationPath $baseline
          if ((Get-Item (Join-Path $baseline 'buddykit.exe')).VersionInfo.ProductVersion -ne '0.3.0+11') { throw 'The selected baseline has the wrong version' }
          foreach ($file in @('flutter_windows.dll', 'data/flutter_assets/assets/tray_icon.ico')) {
            if (-not (Test-Path -LiteralPath (Join-Path $baseline $file))) { throw "Incomplete baseline: $file" }
          }

      - name: Exercise the real public-feed upgrade through the rendered button
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          ./scripts/test_windows_auto_update.ps1 -BaselineDirectory (Join-Path $env:RUNNER_TEMP 'buddykit-update-baseline') -ExpectedVersion '0.3.0' -ExpectedBuild 12 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'buddykit-auto-update-evidence')

      - name: Upload update screenshots and result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-auto-update-evidence-0.3.0
          path: ${{ runner.temp }}/buddykit-auto-update-evidence/
          if-no-files-found: ignore
          retention-days: 3

      - name: Collect updater failure diagnostics
        if: failure()
        run: |
          $updateRoot = Join-Path ([IO.Path]::GetTempPath()) 'BuddyKit/Updates'
          $destination = Join-Path $env:RUNNER_TEMP 'buddykit-auto-update-diagnostics'
          if (Test-Path -LiteralPath $updateRoot -PathType Container) {
            foreach ($run in @(Get-ChildItem -LiteralPath $updateRoot -Directory -Filter 'run-*')) {
              foreach ($name in @('diagnostic.log', 'installer.log')) {
                $log = Join-Path $run.FullName $name
                if (Test-Path -LiteralPath $log -PathType Leaf) {
                  $folder = Join-Path $destination $run.Name
                  $null = New-Item -ItemType Directory -Path $folder -Force
                  Copy-Item -LiteralPath $log -Destination (Join-Path $folder $name)
                }
              }
            }
          }

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-auto-update-diagnostics-0.3.0
          path: ${{ runner.temp }}/buddykit-auto-update-diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove decrypted test input
        if: always()
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-private-source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'BuddyKit-0.3.0-source.tar.gz') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-update-baseline') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-update-baseline-artifact') -Recurse -Force -ErrorAction SilentlyContinue
