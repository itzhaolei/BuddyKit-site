name: Build BuddyKit Windows 0.2.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out encrypted build input
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.6.2

      - name: Decrypt source into temporary build directory
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          from nacl.secret import SecretBox

          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          if len(key) != SecretBox.KEY_SIZE:
              raise RuntimeError('Invalid build decryption key length')
          encrypted = Path('.github/release-inputs/BuddyKit-0.2.2.tar.enc').read_bytes()
          archive = Path(os.environ['RUNNER_TEMP']) / 'BuddyKit-0.2.2-source.tar.gz'
          source = Path(os.environ['RUNNER_TEMP']) / 'buddykit-private-source'
          source.mkdir()
          plaintext = SecretBox(key).decrypt(encrypted)
          expected = 'f0c64557c791baf427dabff49aaffbb31f081bf700dad67e1331b29ae8e66574'
          if hashlib.sha256(plaintext).hexdigest() != expected:
              raise RuntimeError('Build input checksum does not match the approved source')
          archive.write_bytes(plaintext)
          del plaintext
          del key, encrypted
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall(source, filter='data')
          archive.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source decryption failed' }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Build Windows release
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          $buildLog = Join-Path $env:RUNNER_TEMP 'buddykit-windows-build.log'
          flutter build windows --release *> $buildLog
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Write-Output 'Windows release built successfully.'
          $release = 'build/windows/x64/runner/Release'
          foreach ($file in @(
            'buddykit.exe',
            'flutter_windows.dll',
            'msvcp140.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'data/flutter_assets/assets/tray_icon.ico'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $file))) {
              throw "Required Windows bundle file missing: $file"
            }
          }
          $version = (Get-Item (Join-Path $release 'buddykit.exe')).VersionInfo.ProductVersion
          if ($version -notmatch '^0\.2\.2(?:\+8|\.8)?$') {
            throw 'Windows executable does not have the expected 0.2.2 version'
          }

      - name: Build installer with Inno Setup
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          iscc '/DMyAppVersion=0.2.2' 'packaging/windows/BuddyKit.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer packaging failed' }
          if (-not (Test-Path -LiteralPath 'dist/BuddyKit-0.2.2-Setup.exe')) {
            throw 'Expected Windows installer was not produced'
          }

      - name: Upload Windows installer only
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-installer-0.2.2
          path: ${{ runner.temp }}/buddykit-private-source/dist/BuddyKit-0.2.2-Setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Remove decrypted build input
        if: always()
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-private-source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'BuddyKit-0.2.2-source.tar.gz') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-windows-build.log') -Force -ErrorAction SilentlyContinue
