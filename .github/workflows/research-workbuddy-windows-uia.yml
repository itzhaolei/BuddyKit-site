name: Research WorkBuddy logged-out Windows UIA provider
run-name: Official WorkBuddy 5.9.3 logged-out UIA property probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logged-out-provider:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated decryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.6.2
      - name: Decrypt reviewed research input only
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY }}
        run: |
          @'
          import base64, hashlib, io, os, tarfile
          from pathlib import Path
          from nacl.secret import SecretBox
          encrypted = Path('.github/release-inputs/WorkBuddy-Windows-UIA-research.tar.enc').read_bytes()
          if hashlib.sha256(encrypted).hexdigest() != '1c057f06930b7f5f65b7cb530eb6276486b593c34981b68dbe4bacb766dd0a13':
              raise RuntimeError('Research ciphertext mismatch')
          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          plaintext = SecretBox(key).decrypt(encrypted)
          if hashlib.sha256(plaintext).hexdigest() != '866f7ca02bab1967e12d245c5abdd73442e1a6fb09728da2f1f0c6474a627238':
              raise RuntimeError('Research source archive mismatch')
          wanted = {'scripts/research/test_windows_workbuddy_uia_provider.ps1', 'scripts/research/windows_workbuddy_uia_probe.cpp'}
          source = Path(os.environ['RUNNER_TEMP']) / 'buddykit-uia-research-source'
          source.mkdir()
          with tarfile.open(fileobj=io.BytesIO(plaintext), mode='r:gz') as bundle:
              members = bundle.getmembers()
              if len(members) != 2 or {m.name for m in members} != wanted or not all(m.isfile() for m in members):
                  raise RuntimeError('Unexpected research source member')
              bundle.extractall(source, filter='data')
          del key, plaintext, encrypted
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed research decryption failed' }
      - name: Probe official vendor login UI without accounts or task actions
        id: provider_probe
        working-directory: ${{ runner.temp }}/buddykit-uia-research-source
        run: |
          $ErrorActionPreference = 'Stop'
          $taskEvidence = Join-Path $env:RUNNER_TEMP 'buddykit-uia-vendor-evidence'
          $taskOutput = Join-Path $env:RUNNER_TEMP 'buddykit-uia-research-output.log'
          try {
            ./scripts/research/test_windows_workbuddy_uia_provider.ps1 -EvidenceDirectory $taskEvidence *> $taskOutput
            if (-not (Test-Path -LiteralPath (Join-Path $taskEvidence 'result.json'))) { throw 'Provider probe did not produce structured evidence.' }
            $result = Get-Content -LiteralPath (Join-Path $taskEvidence 'result.json') -Raw | ConvertFrom-Json
            if ($result.loginPerformed -ne $false -or $result.messagesSent -ne $false -or $result.taskControlsInvoked -ne $false -or $result.rawUIContentOrUrlsPublished -ne $false) { throw 'Unsafe or unexpected research evidence.' }
            $public = Join-Path $env:RUNNER_TEMP 'buddykit-uia-safe-result'
            $null = New-Item -ItemType Directory -Path $public
            Copy-Item -LiteralPath (Join-Path $taskEvidence 'result.json') -Destination (Join-Path $public 'workbuddy-uia-provider.json')
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $taskOutput
            throw 'Read-only vendor UIA research did not complete; private diagnostics retained encrypted.'
          }
          Write-Output 'Read-only vendor UIA property research completed; no login, task action or hot-switch acceptance.'
      - name: Upload reviewed metadata result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy-logged-out-UIA-safe-result
          path: ${{ runner.temp }}/buddykit-uia-safe-result/workbuddy-uia-provider.json
          if-no-files-found: error
          retention-days: 3
      - name: Encrypt private research diagnostics
        if: always()
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY }}
        run: |
          @'
          import base64, hashlib, io, json, os, tarfile
          from pathlib import Path
          from nacl.secret import SecretBox
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'buddykit-uia-vendor-evidence'
          files = [root / 'buddykit-uia-research-output.log']
          if evidence.is_dir():
              files.extend(p for p in evidence.rglob('*') if p.is_file() and (p.name.endswith('.log') or p.name.endswith('.stderr.txt') or p.name.startswith('uia-sample-') and p.suffix == '.json'))
          output = root / 'buddykit-uia-encrypted-diagnostics'
          output.mkdir()
          stream = io.BytesIO()
          with tarfile.open(fileobj=stream, mode='w:gz') as archive:
              for path in sorted(files):
                  if path.exists():
                      if path.is_symlink() or path.stat().st_size > 32 * 1024 * 1024:
                          raise RuntimeError('Unsafe research diagnostic path')
                      archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          encrypted = bytes(SecretBox(key).encrypt(stream.getvalue()))
          (output / 'research-diagnostics.tar.gz.enc').write_bytes(encrypted)
          record = {'algorithm': 'XSalsa20-Poly1305 SecretBox', 'workflowRun': os.environ['GITHUB_RUN_ID'], 'workflowCommit': os.environ['GITHUB_SHA'], 'researchArchiveSHA256': '866f7ca02bab1967e12d245c5abdd73442e1a6fb09728da2f1f0c6474a627238', 'encryptedSHA256': hashlib.sha256(encrypted).hexdigest(), 'encryptedSize': len(encrypted)}
          (output / 'encrypted-diagnostics.json').write_text(json.dumps(record, indent=2) + '\n')
          del key, encrypted
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Private research diagnostic encryption failed' }
      - name: Upload authenticated encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy-logged-out-UIA-encrypted-diagnostics
          path: ${{ runner.temp }}/buddykit-uia-encrypted-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Clean isolated research files
        if: always()
        run: |
          foreach ($name in @('buddykit-uia-research-source', 'buddykit-uia-vendor-evidence', 'buddykit-uia-research-output.log')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Recurse -Force -ErrorAction SilentlyContinue
          }
