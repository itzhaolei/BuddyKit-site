name: Deploy BuddyKit website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify website download targets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Downloads(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if tag == 'a' and name == 'href' and value.startswith('downloads/'):
                          path = Path(value.split('?', 1)[0])
                          if not path.is_file() or path.stat().st_size == 0:
                              raise SystemExit(f'Download target missing or empty: {path}')
          Downloads().feed(Path('index.html').read_text())
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
