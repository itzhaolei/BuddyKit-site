name: Build BuddyKit Windows 1.0.0
run-name: BuddyKit Windows 1.0.0+26 encrypted input

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out encrypted build input
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install authenticated decryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyNaCl==1.6.2

      - name: Decrypt exact frozen source in temporary directory
        id: decrypt
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY_26 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          $null = New-Item -ItemType Directory -Path $diagnostics
          @'
          import base64, hashlib, os, tarfile
          from pathlib import Path, PurePosixPath
          from nacl.secret import SecretBox
          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          if len(key) != SecretBox.KEY_SIZE:
              raise RuntimeError('Invalid decryption key length')
          data = Path('.github/release-inputs/BuddyKit-1.0.0.tar.enc').read_bytes()
          if hashlib.sha256(data).hexdigest() != '46c392df55f91b96ec561554bcdee1bde5e6201d03b20e24378cc0fa4bef9c57':
              raise RuntimeError('Encrypted input checksum mismatch')
          plaintext = SecretBox(key).decrypt(data)
          if hashlib.sha256(plaintext).hexdigest() != '6828cbea39ea1ad7ba1f6a438e8fc2a539b6c8c43d0dbe466c8700be600e5e53':
              raise RuntimeError('Frozen source archive checksum mismatch')
          archive = Path(os.environ['RUNNER_TEMP']) / 'BuddyKit-1.0.0-source.tar.gz'
          source = Path(os.environ['RUNNER_TEMP']) / 'buddykit-private-source'
          source.mkdir()
          archive.write_bytes(plaintext)
          del plaintext, key, data
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  name = PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts or not name.parts or name.parts[0] not in ('app', 'packaging', 'scripts'):
                      raise RuntimeError('Unexpected source archive member')
              bundle.extractall(source, filter='data')
          archive.unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source decryption failed' }
          Write-Output 'Frozen source decrypted and SHA256 verified.'

      - name: Set up Flutter
        id: flutter_setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Validate Windows PowerShell 5.1 helper
        id: powershell_contracts
        continue-on-error: true
        if: always() && steps.decrypt.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            & {
              $source = Get-Content -Raw app/windows/runner/app_updater.cpp
              $match = [regex]::Match($source, 'R"POWERSHELL\((.*?)\)POWERSHELL"', [System.Text.RegularExpressions.RegexOptions]::Singleline)
              if (-not $match.Success) { throw 'Updater helper was not found' }
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($match.Groups[1].Value, [ref]$tokens, [ref]$errors)
              if ($errors.Count -ne 0) { throw 'Embedded updater PowerShell parser failed' }
              $csharp = [regex]::Match($match.Groups[1].Value, "Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@", [System.Text.RegularExpressions.RegexOptions]::Singleline)
              if (-not $csharp.Success) { throw 'Installer process helper was not found' }
              Add-Type -TypeDefinition $csharp.Groups[1].Value
              foreach ($script in @('scripts/test_windows_auto_update.ps1', 'scripts/test_windows_app_version.ps1', 'scripts/test_windows_single_instance.ps1', 'scripts/test_windows_workbuddy_task_contracts.ps1', 'scripts/test_windows_workbuddy_runtime.ps1')) {
                $tokens = $null
                $errors = $null
                $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
                if ($errors.Count -ne 0) { throw 'Windows PowerShell script parser failed' }
              }
            } *> (Join-Path $diagnostics 'powershell-validation.log')
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'powershell-failure.log')
            throw 'PowerShell 5.1 validation failed; encrypted diagnostics retained.'
          }
          Write-Output 'PowerShell 5.1 helper parser and embedded C# compiler checks passed.'

      - name: Verify Windows native runtime contracts
        id: native_runtime
        continue-on-error: true
        if: always() && steps.decrypt.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          $evidence = Join-Path $diagnostics 'native-runtime'
          try {
            ./scripts/test_windows_workbuddy_runtime.ps1 -EvidenceDirectory $evidence *> (Join-Path $diagnostics 'native-runtime-output.log')
            $results = @(Get-ChildItem -LiteralPath $evidence -Recurse -Filter result.json)
            if ($results.Count -ne 1) { throw 'Expected exactly one runtime contract result' }
            $result = Get-Content -LiteralPath $results[0].FullName -Raw | ConvertFrom-Json
            if ($result.success -ne $true -or $result.realWorkBuddyAcceptance -ne $false) { throw 'Unexpected runtime contract result' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'native-runtime-failure.log')
            throw 'Windows native runtime contracts failed; encrypted diagnostics retained.'
          }
          Write-Output 'Windows native runtime fixture contracts passed; real WorkBuddy not tested.'

      - name: Verify Windows native task contracts
        id: native_tasks
        continue-on-error: true
        if: always() && steps.decrypt.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          $evidence = Join-Path $diagnostics 'native-task'
          try {
            ./scripts/test_windows_workbuddy_task_contracts.ps1 -EvidenceDirectory $evidence *> (Join-Path $diagnostics 'native-task-output.log')
            $results = @(Get-ChildItem -LiteralPath $evidence -Recurse -Filter result.json)
            if ($results.Count -ne 1) { throw 'Expected exactly one task contract result' }
            $result = Get-Content -LiteralPath $results[0].FullName -Raw | ConvertFrom-Json
            if ($result.passed -ne $true -or $result.realWorkBuddyUIATested -ne $false) { throw 'Unexpected task contract result' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'native-task-failure.log')
            throw 'Windows native task contracts failed; encrypted diagnostics retained.'
          }
          Write-Output 'Windows native task policy fixture contracts passed; real WorkBuddy not tested.'

      - name: Resolve Flutter dependencies
        id: dependencies
        continue-on-error: true
        if: always() && steps.decrypt.outcome == 'success' && steps.flutter_setup.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            $taskLog = Join-Path $diagnostics 'flutter-pub-get.log'
            & $env:ComSpec /d /c ('flutter pub get > "' + $taskLog + '" 2>&1')
            if ($LASTEXITCODE -ne 0) { throw 'Command returned a failure exit code.' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'flutter-pub-get-failure.log')
            throw 'Dependency resolution failed; encrypted diagnostics retained.'
          }
          Write-Output 'Flutter dependencies resolved.'

      - name: Analyze Windows Flutter source
        id: analyze
        continue-on-error: true
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            $taskLog = Join-Path $diagnostics 'flutter-analyze.log'
            & $env:ComSpec /d /c ('flutter analyze > "' + $taskLog + '" 2>&1')
            if ($LASTEXITCODE -ne 0) { throw 'Command returned a failure exit code.' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'flutter-analyze-failure.log')
            throw 'Windows static analysis failed; encrypted diagnostics retained.'
          }
          Write-Output 'Windows static analysis passed.'

      - name: Test Windows Flutter source
        id: dart_tests
        continue-on-error: true
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            $taskLog = Join-Path $diagnostics 'flutter-tests.log'
            & $env:ComSpec /d /c ('flutter test --reporter expanded > "' + $taskLog + '" 2>&1')
            if ($LASTEXITCODE -ne 0) { throw 'Command returned a failure exit code.' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'flutter-tests-failure.log')
            throw 'Windows tests failed; encrypted diagnostics retained.'
          }
          Write-Output 'Windows Dart suite passed.'

      - name: Build Windows release
        id: release_build
        continue-on-error: true
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source/app
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            $taskLog = Join-Path $diagnostics 'flutter-build.log'
            & $env:ComSpec /d /c ('flutter build windows --release --build-name=1.0.0 --build-number=26 > "' + $taskLog + '" 2>&1')
            if ($LASTEXITCODE -ne 0) { throw 'Command returned a failure exit code.' }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'flutter-build-failure.log')
            throw 'Windows build failed; encrypted diagnostics retained.'
          }
          $release = 'build/windows/x64/runner/Release'
          foreach ($file in @('buddykit.exe', 'flutter_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'data/flutter_assets/assets/tray_icon.ico')) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $file))) { throw 'Required bundle file is missing.' }
          }
          if ((Get-Item (Join-Path $release 'buddykit.exe')).VersionInfo.ProductVersion -ne '1.0.0+26') { throw 'Executable version mismatch.' }
          Write-Output 'Windows 1.0.0+26 release build passed.'

      - name: Verify actual Windows version and single instance lifecycle
        id: app_lifecycle
        continue-on-error: true
        if: always() && steps.release_build.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          try {
            ./scripts/test_windows_app_version.ps1 -ExecutablePath (Resolve-Path app/build/windows/x64/runner/Release/buddykit.exe).Path -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'buddykit-version-evidence') *> (Join-Path $diagnostics 'app-version.log')
            ./scripts/test_windows_single_instance.ps1 -ExecutablePath (Resolve-Path app/build/windows/x64/runner/Release/buddykit.exe).Path *> (Join-Path $diagnostics 'single-instance.log')
          } catch {
            $_ | Out-String | Add-Content -LiteralPath (Join-Path $diagnostics 'app-lifecycle-failure.log')
            throw 'Windows app lifecycle validation failed; encrypted diagnostics retained.'
          }
          Write-Output 'Rendered sidebar version and single-instance window/tray lifecycle verified.'

      - name: Require all validations before packaging
        id: validation_gate
        if: always()
        run: |
          $checks = @{
            powershell = '${{ steps.powershell_contracts.outcome }}'; nativeRuntime = '${{ steps.native_runtime.outcome }}'; nativeTasks = '${{ steps.native_tasks.outcome }}';
            dependencies = '${{ steps.dependencies.outcome }}'; analyze = '${{ steps.analyze.outcome }}'; dartTests = '${{ steps.dart_tests.outcome }}';
            releaseBuild = '${{ steps.release_build.outcome }}'; appLifecycle = '${{ steps.app_lifecycle.outcome }}'
          }
          $checks | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics/validation-outcomes.json') -Encoding ASCII
          $failed = @($checks.GetEnumerator() | Where-Object { $_.Value -ne 'success' } | ForEach-Object { $_.Key })
          if ($failed.Count -ne 0) { throw ('Required validation failed: ' + ($failed -join ', ') + '. No installer will be packaged.') }
          Write-Output 'All required validations passed.'

      - name: Package installer and public build result
        if: success() && steps.validation_gate.outcome == 'success'
        working-directory: ${{ runner.temp }}/buddykit-private-source
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'buddykit-private-diagnostics'
          iscc '/DMyAppVersion=1.0.0' 'packaging/windows/BuddyKit.iss' *> (Join-Path $diagnostics 'installer-build.log')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath 'dist/BuddyKit-1.0.0-Setup.exe')) { throw 'Installer packaging failed; encrypted diagnostics retained.' }
          $installer = Get-Item -LiteralPath 'dist/BuddyKit-1.0.0-Setup.exe'
          $result = @{
            version = '1.0.0'; build = 26; sourceCommit = '47e4ebae03f65b5c400e5a681ad047882ba94e2b'; sourceArchiveSHA256 = '6828cbea39ea1ad7ba1f6a438e8fc2a539b6c8c43d0dbe466c8700be600e5e53'; encryptedInputSHA256 = '46c392df55f91b96ec561554bcdee1bde5e6201d03b20e24378cc0fa4bef9c57';
            nativeRuntimeFixtureContracts = $true; nativeTaskPolicyContracts = $true; fullDartSuite = $true; staticAnalysis = $true; sidebarVersion = $true; singleInstance = $true;
            realLoggedInWorkBuddyAcceptance = $false; installerSize = $installer.Length; installerSHA256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();
            workflowRun = $env:GITHUB_RUN_ID; workflowCommit = $env:GITHUB_SHA
          }
          $result | ConvertTo-Json | Set-Content -LiteralPath 'dist/windows-build-result.json' -Encoding ASCII
          Write-Output 'Windows installer packaged and output checksum recorded.'

      - name: Upload installer and reviewed build metadata only
        if: success() && steps.validation_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-installer-1.0.0-build26
          path: |
            ${{ runner.temp }}/buddykit-private-source/dist/BuddyKit-1.0.0-Setup.exe
            ${{ runner.temp }}/buddykit-private-source/dist/windows-build-result.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload synthetic sidebar version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-version-evidence-1.0.0-build26
          path: ${{ runner.temp }}/buddykit-version-evidence/
          if-no-files-found: ignore
          retention-days: 3

      - name: Authenticated encryption of private diagnostics
        if: always()
        env:
          BUDDYKIT_BUILD_KEY: ${{ secrets.BUDDYKIT_BUILD_KEY_26 }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, hashlib, io, json, os, tarfile
          from pathlib import Path
          from nacl.secret import SecretBox
          diagnostics = Path(os.environ['RUNNER_TEMP']) / 'buddykit-private-diagnostics'
          if not diagnostics.is_dir():
              raise SystemExit(0)
          output = Path(os.environ['RUNNER_TEMP']) / 'buddykit-encrypted-diagnostics'
          output.mkdir()
          stream = io.BytesIO()
          with tarfile.open(fileobj=stream, mode='w:gz') as bundle:
              for path in sorted(diagnostics.rglob('*')):
                  if path.is_symlink():
                      raise RuntimeError('Refusing linked diagnostics')
                  if path.is_file():
                      bundle.add(path, arcname=str(path.relative_to(diagnostics)), recursive=False)
          plaintext = stream.getvalue()
          key = base64.b64decode(os.environ['BUDDYKIT_BUILD_KEY'], validate=True)
          if len(key) != SecretBox.KEY_SIZE:
              raise RuntimeError('Invalid diagnostic encryption key')
          encrypted = bytes(SecretBox(key).encrypt(plaintext))
          (output / 'windows-diagnostics.tar.gz.enc').write_bytes(encrypted)
          record = {'algorithm': 'XSalsa20-Poly1305 SecretBox', 'workflowRun': os.environ['GITHUB_RUN_ID'], 'workflowCommit': os.environ['GITHUB_SHA'], 'encryptedSHA256': hashlib.sha256(encrypted).hexdigest(), 'encryptedSize': len(encrypted), 'sourceArchiveSHA256': '6828cbea39ea1ad7ba1f6a438e8fc2a539b6c8c43d0dbe466c8700be600e5e53'}
          (output / 'encrypted-diagnostics.json').write_text(json.dumps(record, indent=2) + '\n')
          del plaintext, key, encrypted
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic encryption failed; no plaintext diagnostic artifact will be uploaded.' }

      - name: Upload encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuddyKit-windows-encrypted-diagnostics-1.0.0-build26
          path: ${{ runner.temp }}/buddykit-encrypted-diagnostics/
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove decrypted temporary source and diagnostics
        if: always()
        run: |
          foreach ($name in @('buddykit-private-source', 'BuddyKit-1.0.0-source.tar.gz', 'buddykit-private-diagnostics')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Recurse -Force -ErrorAction SilentlyContinue
          }
